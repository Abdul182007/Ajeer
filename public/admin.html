<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff"><title>التحقق من تصريح أجير</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="site-shell">
  <header class="topbar">
    <a href="/" aria-label="الصفحة الرئيسية"><img src="/images/mlsd-logo.png" alt="شعار وزارة الموارد البشرية والتنمية الاجتماعية"></a>
    <a href="/" aria-label="أجير"><img src="/images/ajeer-logo.png" alt="شعار أجير"></a>
  </header>
  <main class="main-stage">
    <section class="search-card">
      <div class="search-heading"><img src="/images/ajeer-logo.png" alt="أجير"><h1>التحقق من تصريح أجير</h1></div>
      <p>يرجى إدخال رقم التصريح لعرض بياناته</p>
      <form id="permitSearchForm" class="public-search-form">
        <label for="permitNumber">رقم التصريح</label>
        <div class="search-row">
          <input id="permitNumber" name="permitNumber" type="text" required maxlength="80" autocomplete="off" placeholder="أدخل رقم التصريح">
          <button class="primary-button" type="submit">بحث</button>
        </div>
        <p id="searchMessage" class="search-message" role="alert"></p>
      </form>
    </section>
  </main>
  <footer class="footer">
 <nav class="footer-links" aria-label="روابط الموقع">
  <div class="footer-column">
   <strong>أجير</strong>
   <a href="https://www.ajeer.com.sa/" target="_blank" rel="noopener">عن أجير</a>
   <a href="https://www.ajeer.com.sa/" target="_blank" rel="noopener">خدمات أجير</a>
  </div>
  <div class="footer-column">
   <strong>الدعم</strong>
   <a href="https://www.hrsd.gov.sa/en" target="_blank" rel="noopener">الدعم و المساعدة</a>
   <a href="https://www.hrsd.gov.sa/en" target="_blank" rel="noopener">الأسئلة الشائعة</a>
  </div>
  <div class="footer-column">
   <strong>الشروط و الخصوصية</strong>
   <a href="https://www.ajeer.com.sa/" target="_blank" rel="noopener">الشروط والأحكام</a>
   <a href="https://www.ajeer.com.sa/" target="_blank" rel="noopener">سياسة الخصوصية</a>
  </div>
  <div class="footer-column footer-contact">
   <strong>تواصل معنا</strong>
   <div class="footer-social" aria-label="قنوات التواصل">
    <span aria-label="اتصال" role="img"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 2.8 9.4 2l2 4.8-2.1 1.6a15.2 15.2 0 0 0 6.3 6.3l1.6-2.1 4.8 2-.8 2.8c-.4 1.4-1.8 2.3-3.2 2.1C9.7 18.4 5.6 14.3 4.5 8c-.2-1.4.7-2.8 2.1-3.2Z"/></svg></span>
    <span aria-label="Telegram" role="img"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.5 3.2-3.3 17c-.2 1.2-.9 1.5-1.9.9l-5.2-3.9-2.5 2.4c-.3.3-.6.6-1.2.6l.4-5.3 9.7-8.8c.4-.4-.1-.6-.6-.2L5 13.3l-5-1.6c-1.1-.3-1.1-1.1.2-1.6L19.7 2c.9-.3 2.1.2 1.8 1.2Z"/></svg></span>
    <span aria-label="X" role="img"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.9 5.8 22H2.6l7.3-8.4L1.9 2h6.5l4.5 6.7L18.9 2Zm-1.1 18h1.7L7.4 3.9H5.6L17.8 20Z"/></svg></span>
   </div>
  </div>
 </nav>
 <div class="footer-logo-strip">
  <img class="logo-digital" src="/images/digital-govt-auth-logo.svg" alt="الحكومة الرقمية">
  <img class="logo-takamol" src="/images/takamol-logo.png" alt="تكامل">
  <img class="logo-tamkeen" src="/images/tamkeen-logo.svg" alt="تمكين">
  <img class="logo-mlsd" src="/images/mlsd-logo.png" alt="وزارة الموارد البشرية والتنمية الاجتماعية">
 </div>
</footer>
</div>
<script>
document.getElementById("permitSearchForm").addEventListener("submit", function (event) {
  event.preventDefault();
  const value = document.getElementById("permitNumber").value.trim();
  const message = document.getElementById("searchMessage");
  if (!value) { message.textContent = "يرجى إدخال رقم التصريح."; return; }
  window.location.href = "/permit/" + encodeURIComponent(value);
});
</script>
<script src="/permit-chat.js"></script>
</body></html>
